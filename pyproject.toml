[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strike-zone-perception"
version = "0.1.0"
description = "Strike Zone Perception & Bayesian Swing Decision (DVA) Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Chris Song" }
]
keywords = ["baseball", "sabermetrics", "statcast", "deep-learning", "lstm", "bayesian", "swing-decisions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "xgboost>=1.7.0",
    "pyarrow>=12.0.0",
    "plotly>=5.14.0",
    "pybaseball>=2.2.7",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
